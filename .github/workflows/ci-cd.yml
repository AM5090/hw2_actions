name: Security Pipeline

on:
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

  security-analysis:
    needs: install
    runs-on: ubuntu-latest
    outputs:
      vulnerabilities: ${{ steps.check-vulns.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 1. Generate SBOM
      - name: Generate SBOM
        run: |
          npm install -g @cyclonedx/cyclonedx-npm
          cyclonedx-npm --output-file sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      # 2. Dependency Scanning
      - name: Run Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "${{ github.event.repository.name }}"
          path: "."
          format: "HTML"
          out: "reports/"

      # 3. NPM Audit
      - name: NPM Audit
        run: npm audit --json > npm-audit.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: npm-audit.json

      # 4. Trivy SBOM Scan
      - name: Scan SBOM with Trivy
        uses: aquasecurity/trivy-action@0.19.0
        with:
          scan-type: "fs"
          format: "sarif"
          output: "trivy-results.sarif"
          scan-ref: "sbom.json"

      # Check vulnerabilities count
      - name: Count vulnerabilities
        id: check-vulns
        run: |
          COUNT=0
          if [ -f "npm-audit.json" ]; then
            COUNT=$((COUNT + $(jq '.metadata.vulnerabilities.total // 0' npm-audit.json)))
          fi
          echo "count=$COUNT" >> $GITHUB_OUTPUT

  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test

  deploy:
    needs: [security-analysis, test]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /app
            git pull
            docker compose up -d --build

  summary:
    needs: [security-analysis, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Security Summary
        env:
          VULN_COUNT: ${{ needs.security-analysis.outputs.vulnerabilities }}
        run: |
          echo "## Security Report" >> $GITHUB_STEP_SUMMARY
          echo "**Vulnerabilities found:** $VULN_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Available Reports:" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Dependency Check Report" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 SBOM (Software Bill of Materials)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 NPM Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "- 🛡️ Trivy SBOM Analysis" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `## 🔒 Security Scan Complete

            **Status:** ${{ job.status }}
            **Vulnerabilities found:** ${{ needs.security-analysis.outputs.vulnerabilities || 0 }}

            All security reports are available in the Artifacts section.

            *Reports are stored for 7 days*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
